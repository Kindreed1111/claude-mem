<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Digger</title>
<meta name="description" content="Tape un sujet, réponds juste et creuse toujours plus profond. Trois erreurs et tu finis enseveli.">
<meta name="theme-color" content="#FF8A1F">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Grandstander:wght@500;700;800&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: one full-bleed drawn scene; every control is an object of the mine pinned around the miner
   (plank floating over his helmet, coal slabs set in the earth, signs hanging on ropes). Single look by design. */
:root{
  --sky:#FF8A1F; --sun:#FFD23F; --sun-deep:#C98F0A; --pale:#FFE08A; --ink:#17130F; --coal:#2B231B;
  --dirt:#8A5527; --dirt-deep:#3B2110; --diamond:#4FD8FF; --ice:#D9F8FF;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --text:"Grandstander","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;
  --wob:20px 26px 18px 28px / 26px 18px 28px 20px;
  --wob-s:13px 17px 12px 18px / 17px 12px 18px 13px;
  --g:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#ui{position:absolute;inset:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#ui button,#ui form,#ui input,#ui a{pointer-events:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--diamond);outline-offset:3px}

/* ---- title ---- */
#logo{position:absolute;left:0;right:0;top:clamp(12px,5vh,46px);margin:0;text-align:center;font:400 clamp(44px,12vw,92px)/.84 var(--display);color:var(--ink);text-shadow:4px 5px 0 var(--sun);transition:transform .55s cubic-bezier(.6,-.35,.7,.4),opacity .4s}
#logo span{display:block;font-size:.42em;letter-spacing:.3em;margin-left:.3em;text-shadow:2px 3px 0 var(--sun)}
.playing #logo{transform:translateY(-160%);opacity:0}

/* ---- start: plank floating above the helmet ---- */
#start{position:absolute;left:var(--g);right:var(--g);bottom:calc(100% - var(--head,300px) + 24px);display:flex;flex-direction:column;align-items:center;gap:13px;transition:transform .4s cubic-bezier(.6,-.3,.7,.4),opacity .3s}
.playing #start{transform:translateY(-30px) scale(.9);opacity:0;visibility:hidden;transition:transform .3s,opacity .25s,visibility 0s .3s}
#veins{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:520px}
.vein{all:unset;box-sizing:border-box;cursor:pointer;background:var(--ink);color:var(--sun);font:700 14px/1 var(--text);padding:8px 13px 7px;border-radius:44% 56% 52% 48% / 58% 46% 54% 42%;transition:transform .12s,background .12s,color .12s}
.vein:nth-child(even){border-radius:54% 46% 45% 55% / 46% 58% 42% 54%}
.vein:hover,.vein:focus-visible{background:var(--sun);color:var(--ink);transform:translateY(-2px) rotate(-2deg)}
.vein:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#quip{max-width:440px;margin:0;background:var(--pale);border:3.5px solid var(--ink);border-radius:var(--wob);padding:9px 16px 10px;font:700 16px/1.25 var(--text);text-align:center;text-wrap:balance;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#search{position:relative;display:flex;align-items:center;gap:8px;width:min(440px,100%);padding:7px 7px 7px 18px;background:var(--sun);border:3.5px solid var(--ink);border-radius:var(--wob);box-shadow:5px 6px 0 var(--ink);animation:bob 3.2s ease-in-out infinite}
#search::after{content:"";position:absolute;left:50%;bottom:-14px;width:25px;height:25px;margin-left:-12px;background:var(--sun);border-right:3.5px solid var(--ink);border-bottom:3.5px solid var(--ink);border-radius:0 0 5px 0;transform:rotate(45deg)}
#search:focus-within{box-shadow:7px 8px 0 var(--ink)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);caret-color:var(--ink);font:800 clamp(16px,4.4vw,20px)/1.2 var(--text);padding:8px 0 6px;user-select:text;-webkit-user-select:text}
#q::placeholder{color:var(--ink);opacity:.55;font-weight:700}
#q::selection{background:var(--ink);color:var(--sun)}
#go{all:unset;box-sizing:border-box;flex:none;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;background:var(--ink);border-radius:48% 52% 50% 50% / 54% 47% 53% 46%;transition:transform .15s}
#go svg{width:28px;height:28px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
#go:hover svg,#go:focus-visible svg{transform:rotate(-24deg) translateY(2px)}
#go:active{transform:scale(.92)}
#go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#hint{position:absolute;left:var(--g);right:var(--g);bottom:max(18px,env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:var(--pale);font:700 14px/1.3 var(--text);letter-spacing:.02em;transition:opacity .3s}
.playing #hint{opacity:0}

/* ---- hud: signs hanging on ropes ---- */
#hud{position:absolute;top:0;left:var(--g);right:var(--g);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sign{position:relative;margin-top:20px;background:var(--ink);color:var(--sun);padding:6px 14px 7px;border-radius:var(--wob-s);transform:rotate(-2deg);transform-origin:50% -20px;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.sign::before,.sign::after{content:"";position:absolute;top:-22px;width:3px;height:23px;background:var(--ink)}
.sign::before{left:15px}.sign::after{right:15px}
.sign small{display:block;font:800 10px/1.1 var(--text);letter-spacing:.14em;text-transform:uppercase}
#depth{display:block;font:400 25px/1.05 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
#best{display:block;font:700 11px/1.2 var(--text);color:var(--pale);margin-top:2px;white-space:nowrap}
.sign.bump{animation:swing .7s}
#game:not(.playing) .sign,#game:not(.playing) #lives{transform:translateY(-140px);opacity:0}
#right{display:flex;align-items:center;gap:10px;margin-top:12px}
#lives{display:flex;gap:4px;padding:3px 7px 2px;background:var(--pale);border:3px solid var(--ink);border-radius:var(--wob-s);transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .3s}
#lives svg{width:32px;height:28px;display:block}
#lives .lost .hat{display:none}
#lives svg:not(.lost) .heap{display:none}
#lives .lost{animation:thud .45s cubic-bezier(.3,1.5,.5,1)}
#snd{all:unset;box-sizing:border-box;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;background:var(--ink);border-radius:50% 46% 52% 48% / 47% 52% 48% 53%}
#snd svg{width:22px;height:22px}
#snd[aria-pressed="false"] .on{display:none}
#snd[aria-pressed="true"] .off{display:none}
#snd:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---- the miner's bubble ---- */
#bubble{position:absolute;left:0;right:0;margin-inline:auto;bottom:calc(100% - var(--head,300px) + 24px);width:min(600px,calc(100% - 2*var(--g)));background:var(--pale);border:3.5px solid var(--ink);border-radius:var(--wob);box-shadow:5px 6px 0 var(--ink);padding:11px 18px 13px;transform-origin:50% 100%}
#bubble{transition:bottom .28s cubic-bezier(.3,1.3,.5,1)}
#bubble.up{bottom:calc(100% - var(--head,300px) + 24px + var(--lift,70px))}
#bubble::after{content:"";position:absolute;left:50%;bottom:-14px;width:25px;height:25px;margin-left:-12px;background:var(--pale);border-right:3.5px solid var(--ink);border-bottom:3.5px solid var(--ink);border-radius:0 0 5px 0;transform:rotate(45deg)}
#bubble.pop{animation:pop .28s cubic-bezier(.3,1.5,.5,1)}
#btag{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font:400 12px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase}
#btag b{font-weight:400;background:var(--ink);color:var(--sun);padding:3px 8px 2px;border-radius:9px 11px 8px 12px / 11px 8px 12px 9px}
#btag i{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
#btext{margin:5px 0 0;font:800 clamp(16px,2.4vw,21px)/1.24 var(--text);text-wrap:balance;overflow-wrap:anywhere}
#bnote{margin:5px 0 0;font:500 clamp(13.5px,1.9vw,15.5px)/1.3 var(--text);overflow-wrap:anywhere}
#bubble.tight #btext{font-size:15px}#bubble.tight #bnote{font-size:13px}
#bubble.good{background:var(--ice)}#bubble.good::after{background:var(--ice)}

#bsrc{display:inline-block;margin-top:4px;font:700 12px/1.2 var(--text);color:var(--ink);opacity:.7;text-decoration:underline;text-underline-offset:2px}
#bsrc:hover,#bsrc:focus-visible{opacity:1}
/* ---- stratum plank dropping from the top ---- */
#stratum{position:absolute;top:112px;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 2*var(--g));background:var(--ink);color:var(--pale);text-align:center;padding:8px 18px 9px;border-radius:var(--wob-s);box-shadow:0 0 0 3px var(--sun);opacity:0;pointer-events:none;z-index:2}
#stratum small{display:block;font:800 10px/1.1 var(--text);letter-spacing:.16em;text-transform:uppercase;color:var(--sun)}
#stratum b{display:block;font:400 clamp(16px,4.6vw,21px)/1.1 var(--display);margin-top:3px}
#stratum.show{animation:plank 3.2s cubic-bezier(.3,1.3,.5,1) both}
@keyframes plank{0%{transform:translateY(-26px) scale(.7) rotate(-4deg);opacity:0}10%,84%{transform:none;opacity:1}100%{transform:translateY(-18px) scale(.85);opacity:0}}
#game.running #stratum{display:none}
/* ---- air gauge: a strip of light set above the coal slabs; when it is empty the gallery caves in ---- */
#air{grid-column:1/-1;display:flex;align-items:center;gap:8px}
#air b{flex:none;background:var(--ink);color:var(--sun);font:400 11px/1 var(--display);letter-spacing:.08em;padding:5px 8px 4px;border-radius:var(--wob-s)}
#air span{flex:1;height:14px;background:var(--ink);border:3px solid var(--ink);border-radius:9px 11px 8px 12px / 11px 8px 12px 9px;overflow:hidden}
#air i{display:block;height:100%;background:var(--sun);border-radius:5px;transform-origin:0 50%;will-change:transform}
#air.low i{background:var(--sky)}
#air.low{animation:shake .4s infinite}
#air.off{opacity:.45}
/* ---- answers: coal slabs set in the earth ---- */
#answers{position:absolute;left:0;right:0;margin-inline:auto;bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 2*var(--g)));display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
@media (min-width:640px){#answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.ans{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;min-height:47px;min-width:0;padding:6px 14px 6px 8px;cursor:pointer;background:var(--ink);color:var(--sun);font:700 clamp(15px,2vw,17.5px)/1.15 var(--text);border:3px solid var(--ink);border-radius:var(--wob-s);box-shadow:0 5px 0 rgba(23,19,15,.38);transition:transform .12s,background .12s,color .12s,opacity .2s;animation:rise .34s cubic-bezier(.3,1.4,.5,1) both}
.ans:nth-child(2){animation-delay:.05s;border-radius:17px 12px 18px 13px / 12px 18px 13px 17px}
.ans:nth-child(3){animation-delay:.1s}
.ans:nth-child(4){animation-delay:.15s;border-radius:17px 12px 18px 13px / 12px 18px 13px 17px}
.ans .key{flex:none;width:29px;height:29px;display:grid;place-items:center;background:var(--sun);color:var(--ink);font:400 14px/1 var(--display);border-radius:46% 54% 50% 50% / 55% 48% 52% 45%;padding-top:1px}
.ans .txt{min-width:0;overflow-wrap:anywhere}
@media (hover:hover){.ans:hover{background:var(--sun);color:var(--ink);transform:translateY(-3px)}.ans:hover .key{background:var(--ink);color:var(--sun)}}
.ans:focus-visible{background:var(--sun);color:var(--ink);outline:3px solid var(--ink);outline-offset:2px}
.ans:focus-visible .key{background:var(--ink);color:var(--sun)}
.ans:active{transform:translateY(2px)}
.ans[disabled]{cursor:default;pointer-events:none}
.ans.good{background:var(--diamond);color:var(--ink);border-color:var(--ice);box-shadow:0 0 0 3px var(--ink),0 0 28px var(--diamond)}
.ans.good .key{background:var(--ink);color:var(--diamond)}
.ans.bad{background:var(--dirt);color:var(--pale);border-color:var(--dirt-deep);animation:shake .4s}
.ans.bad .key{background:var(--dirt-deep);color:var(--pale)}
.ans.dim{opacity:.4}

/* ---- end board ---- */
#over{position:absolute;left:0;right:0;margin-inline:auto;top:clamp(26px,7vh,70px);width:min(500px,calc(100% - 2*var(--g)))}
.board{position:relative;background:var(--ink);color:var(--pale);border-radius:var(--wob);padding:16px 18px 18px;text-align:center;box-shadow:0 8px 0 rgba(23,19,15,.3);animation:drop .65s cubic-bezier(.3,1.35,.5,1);transform-origin:50% -80px}
.board::before,.board::after{content:"";position:absolute;bottom:calc(100% - 4px);width:4px;height:400px;background:var(--ink)}
.board::before{left:34px}.board::after{right:34px}
.board h2{margin:0;font:400 clamp(34px,9.5vw,54px)/.95 var(--display);color:var(--sun);letter-spacing:.01em}
#epitaph{margin:7px 0 12px;font:500 15px/1.3 var(--text);text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 14px}
.stats div{background:var(--coal);border-radius:var(--wob-s);padding:7px 8px 6px;min-width:0}
.stats dt{font:800 10px/1.1 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
.stats dd{margin:3px 0 0;font:400 clamp(12.5px,3.5vw,16px)/1.1 var(--display);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#oShovel{color:var(--diamond)}
#stamp{position:absolute;top:-12px;right:-8px;background:var(--diamond);color:var(--ink);font:400 12px/1 var(--display);padding:7px 10px 6px;border-radius:var(--wob-s);transform:rotate(8deg);animation:pop .4s .6s cubic-bezier(.3,1.6,.5,1) both}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plank{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sun);color:var(--ink);font:400 15px/1.1 var(--display);padding:11px 16px 10px;border-radius:var(--wob-s);box-shadow:0 4px 0 var(--sun-deep);transition:transform .12s}
.plank.alt{background:transparent;color:var(--sun);box-shadow:inset 0 0 0 3px var(--sun)}
.plank:hover{transform:translateY(-2px) rotate(-1deg)}.plank:active{transform:translateY(2px)}
.plank:focus-visible{outline:3px solid var(--diamond);outline-offset:3px}

/* ---- the chase (runner mini-game): its own hanging sign, everything else of the quiz steps aside ---- */
#rsign,#rquit{display:none}
#game.running{touch-action:none}
#game.running :is(#logo,#start,#hint,#bubble,#answers,#over,#sign,#lives){display:none!important}
#game.running #rsign{display:block;transform:rotate(-2deg);opacity:1}
#rscore{display:block;font:400 25px/1.05 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
#rbest{display:block;font:700 11px/1.2 var(--text);color:var(--pale);margin-top:2px;white-space:nowrap}
#rsign.rec #rscore{color:var(--diamond)}
#rquit{all:unset;box-sizing:border-box;position:relative;width:40px;height:40px;display:none;place-items:center;cursor:pointer;background:var(--ink);border-radius:47% 53% 49% 51% / 52% 47% 53% 48%}
#game.running #rquit{display:grid}
#rquit svg{width:22px;height:22px}
#rquit:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#rquit.ready::after{content:"";position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--diamond);box-shadow:0 0 0 3px var(--ink);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8)}50%{transform:scale(1.25)}}

@media (max-height:520px){
  #logo{font-size:38px}#veins{display:none}
  #bubble{padding:7px 14px 9px}#btext{font-size:14.5px}#bnote{font-size:12.5px}
  #answers{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.ans{min-height:38px;font-size:14px}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(46px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes swing{0%{transform:rotate(-2deg)}25%{transform:rotate(7deg) translateY(4px)}55%{transform:rotate(-6deg)}80%{transform:rotate(1deg)}100%{transform:rotate(-2deg)}}
@keyframes thud{from{transform:translateY(-16px) scale(1.3)}to{transform:none}}
@keyframes drop{from{transform:translateY(-120%) rotate(-5deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="game">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="ui">
    <h1 id="logo"><span>THE</span>DIGGER</h1>

    <div id="hud">
      <div class="sign" id="sign" aria-live="off">
        <small>Profondeur</small>
        <span id="depth">0 m</span>
        <span id="best" hidden></span>
      </div>
      <div class="sign" id="rsign" aria-live="off">
        <small>Course</small>
        <span id="rscore">0</span>
        <span id="rbest">Record 0</span>
      </div>
      <div id="right">
        <div id="lives" role="img" aria-label="3 casques restants">
          <svg viewBox="0 0 36 32"><g class="hat"><path d="M5 23a13 13 0 0 1 26 0z" fill="#17130F"/><rect x="2" y="22" width="32" height="5" rx="2.5" fill="#17130F"/><circle cx="18" cy="14" r="4" fill="#FFD23F"/></g><path class="heap" d="M3 28c3-9 8-15 15-15s12 6 15 15z" fill="#A66B34" stroke="#17130F" stroke-width="2.5" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 36 32"><g class="hat"><path d="M5 23a13 13 0 0 1 26 0z" fill="#17130F"/><rect x="2" y="22" width="32" height="5" rx="2.5" fill="#17130F"/><circle cx="18" cy="14" r="4" fill="#FFD23F"/></g><path class="heap" d="M3 28c3-9 8-15 15-15s12 6 15 15z" fill="#A66B34" stroke="#17130F" stroke-width="2.5" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 36 32"><g class="hat"><path d="M5 23a13 13 0 0 1 26 0z" fill="#17130F"/><rect x="2" y="22" width="32" height="5" rx="2.5" fill="#17130F"/><circle cx="18" cy="14" r="4" fill="#FFD23F"/></g><path class="heap" d="M3 28c3-9 8-15 15-15s12 6 15 15z" fill="#A66B34" stroke="#17130F" stroke-width="2.5" stroke-linejoin="round"/></svg>
        </div>
        <button id="rquit" type="button" aria-label="Arrêter la course et revenir au quiz">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-5 5 5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button id="snd" type="button" aria-pressed="true" aria-label="Son de la mine">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M6 17c1-2 1-4 1-6a5 5 0 0 1 10 0c0 2 0 4 1 6z" fill="#FFD23F"/><path d="M10.5 20.5h3"/><path class="off" d="M4 4l16 16" stroke="#FF8A1F" stroke-width="3"/></svg>
        </button>
      </div>
    </div>

    <div id="stratum" aria-live="polite"><small>Nouvelle strate</small><b></b></div>

    <div id="start">
      <div id="veins"></div>
      <p id="quip" hidden></p>
      <form id="search" autocomplete="off" novalidate>
        <label class="sr" for="q">Sujet à creuser</label>
        <input id="q" name="q" type="text" maxlength="60" placeholder="Tape un sujet… ou creuse direct" enterkeyhint="go" autocapitalize="sentences" autocorrect="off" spellcheck="false">
        <button id="go" type="submit" aria-label="Creuser ce sujet">
          <svg viewBox="0 0 28 28"><path d="M20 4l4 4M22 6L11 17" stroke="#FFD23F" stroke-width="3.4" stroke-linecap="round" fill="none"/><path d="M12.5 12.5l3 3c-1 5-4 8.500-10.500 9.500C6 18.500 7.500 15 12.500 12.500z" fill="#FFD23F"/></svg>
        </button>
      </form>
    </div>
    <p id="hint">Bonne réponse : il creuse. Trois erreurs : il finit enseveli.<br>Double-tape le mineur : course-poursuite dans la mine.</p>

    <div id="bubble" hidden role="status" aria-live="polite">
      <div id="btag"></div>
      <p id="btext"></p>

      <div id="air" role="img" aria-label="Air restant"><b>AIR</b><span><i></i></span></div>
      <button class="ans" type="button"><span class="key">A</span><span class="txt"></span></button>
      <button class="ans" type="button"><span class="key">B</span><span class="txt"></span></button>
      <button class="ans" type="button"><span class="key">C</span><span class="txt"></span></button>
      <button class="ans" type="button"><span class="key">D</span><span class="txt"></span></button>
    </div>

    <section id="over" hidden aria-live="polite">
      <div class="board">
        <span id="stamp" hidden>Nouveau record</span>
        <h2 id="oTitle">Enseveli</h2>
        <p id="epitaph"></p>
        <dl class="stats">
          <div><dt>Filon</dt><dd id="oTopic"></dd></div>
          <div><dt>Profondeur</dt><dd id="oDepth"></dd></div>
          <div><dt>Pelle</dt><dd id="oShovel"></dd></div>
          <div><dt>Sujet</dt><dd id="oSubject"></dd></div>
          <div><dt>Série max</dt><dd id="oStreak"></dd></div>
          <div><dt>Record</dt><dd id="oBest"></dd></div>
        </dl>
        <div class="acts">
          <button class="plank" id="again" type="button">Recreuser ce filon</button>
          <button class="plank alt" id="fresh" type="button">Nouveau filon</button>
          <button class="plank alt" id="share" type="button">Partager</button>
        </div>
      </div>
    </section>
  </div>
</div>
<script>
(()=>{
'use strict';
/* ================= engine & scene ================= */
const $=s=>document.querySelector(s);
const game=$('#game'),ui=$('#ui'),cv=$('#scene'),g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={sky:'#FF8A1F',haze:'#FFA040',hill:'#EE6C0C',sun:'#FFD23F',pale:'#FFE08A',ink:'#17130F',dirt:'#8A5527',deep:'#4C2B13',pit:'#42250F',pit2:'#26140A',mound:'#A66B34',clod:'#7F4D22',eye:'#FFF1CF',dia:'#4FD8FF',ice:'#D9F8FF',white:'#FFFFFF'};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const ease={out:t=>1-Math.pow(1-t,3),io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,in:t=>t*t*t,lin:t=>t};
function hash(a,b){let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
function mix(a,b,t){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}
const STOPS=[[0,'#17130F'],[2,'#1B2530'],[4,'#1F4670'],[6,'#1F7FCC'],[8,'#33B6F2'],[10,'#5CE2FF']];
function bladeColor(l){l=clamp(l,0,10);for(let i=1;i<STOPS.length;i++)if(l<=STOPS[i][0]){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];return mix(ca,cb,(l-a)/(b-a))}return STOPS[STOPS.length-1][1]}
const tierName=l=>l>=10?'Diamant':l>=7?'Saphir':l>=4?'Acier bleui':l>=2?'Fer':'Charbon';
const depthM=n=>n*n+4*n;
/* geological strata by depth in metres: a = earth, b = its alternate band, pit/pit2 = the dug shaft, mote = ambient particles */
const STRATA=[
  {n:'Terre & Argile',m:0,a:'#8A5527',b:'#7A4A21',pit:'#42250F',pit2:'#26140A',mote:'#FFE08A'},
  {n:'Roche & Charbon',m:50,a:'#635B52',b:'#544D45',pit:'#34302B',pit2:'#1E1B18',mote:'#17130F'},
  {n:'Galerie de Cristal',m:150,a:'#27587A',b:'#204B69',pit:'#163349',pit2:'#0D2030',mote:'#D9F8FF'},
  {n:'Filon d’Or',m:300,a:'#80601A',b:'#6E5114',pit:'#43310B',pit2:'#281D06',mote:'#FFD23F'},
  {n:'Noyau Magmatique',m:500,a:'#63220F',b:'#521A0B',pit:'#351007',pit2:'#1E0804',mote:'#FF8A1F'}
];
STRATA.forEach(s=>{s.lv=Math.sqrt(4+s.m)-2}); /* level at which the stratum starts (inverse of depthM) */
function stratumOf(lv){let i=0;while(i<STRATA.length-1&&lv>=STRATA[i+1].lv-1e-6)i++;return i}
function sc(lv,key){ /* stratum colour at a (fractional) level, blended over one level around each boundary */
  const i=stratumOf(lv+.5),p=i>0?clamp(lv-(STRATA[i].lv-.5),0,1):1;
  return p<1?mix(STRATA[i-1][key],STRATA[i][key],p):STRATA[i][key];
}

let W=0,H=0,S=1,DPR=1,cx=0,feetY=0,feetFrac=.58,STEP=84,shaftW=240,now=0;
const world={d:0,cam:0,level:0,shake:0,punch:0,galleries:[],over:false};
const hero={pose:'idle',pt:0,buried:0,buriedTo:0,mood:'calm',moodT:0,grab:0,shine:0,squash:0,tapN:0,blinkAt:2,dizzy:0};
const ptr={x:0,t:-9},spy={a:0},worm={t0:-99,next:8,wy:0};
const foe={on:false,x:0,wy:0,phase:'walk',pt:0,walk:0,flip:true,load:0,mood:'angry'};
const parts=[],timers=[],tweens=[];
const after=(s,fn)=>timers.push({t:now+s,fn});
const tween=(dur,step,done,e)=>tweens.push({t:0,dur,step,done,e:e||ease.out});
const sY=wy=>feetY+(wy-world.cam);
const bandCols=[];for(let b=0;b<40;b++)bandCols.push(mix(C.dirt,C.deep,clamp(b/8,0,1)*(b%2?.92:1)+(b%2?.06:0)));

function resize(){
  W=game.clientWidth;H=game.clientHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  S=clamp(Math.min(W/420,H/720),.6,1.2);STEP=84*S;shaftW=Math.min(W*.62,300*S);cx=W/2;
  placeFeet();world.cam=world.d*STEP;if(R.on)rlayout();
}
function placeFeet(){feetY=H*feetFrac;ui.style.setProperty('--head',Math.round(feetY-120*S)+'px');ui.style.setProperty('--lift',Math.round(76*S)+'px')}

/* ---------- particles ---------- */
function dirtBurst(x,wy,n,pow){for(let i=0;i<n;i++)parts.push({k:'dirt',x:x+rnd(-1,1)*shaftW*.3,y:wy-rnd(0,6),vx:rnd(-190,190)*S*pow,vy:-rnd(240,620)*S*pow,g:1500*S,life:0,max:rnd(.5,.95),r:rnd(3,7.5)*S,c:pick([C.mound,C.clod,C.dirt,C.pit2])})}
function dust(x,wy,n){for(let i=0;i<n;i++)parts.push({k:'dust',x:x+rnd(-8,8)*S,y:wy-rnd(0,5)*S,vx:rnd(-60,60)*S,vy:-rnd(10,70)*S,g:60*S,life:0,max:rnd(.35,.7),r:rnd(4,9)*S,c:C.mound})}
function sparks(x,wy,n,pow){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(90,430)*S*pow;parts.push({k:'spark',x,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120*S,g:260*S,life:0,max:rnd(.45,1.1),r:rnd(4,11)*S,rot:rnd(0,3),vr:rnd(-5,5),c:pick([C.ice,C.dia,C.white,C.sun])})}}
function ring(x,wy){parts.push({k:'ring',x,y:wy,vx:0,vy:0,g:0,life:0,max:.5,r:20*S,c:C.dia})}
function star(x,y,r,rot,c){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=c;g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,q=i%2?r*.28:r;g.lineTo(Math.cos(a)*q,Math.sin(a)*q)}g.closePath();g.fill();g.restore()}

/* ---------- sky & earth ---------- */
function pill(x,y,w,h){g.beginPath();g.roundRect(x-w/2,y-h/2,w,h,h/2);g.fill()}
function headframe(x,y0,sc,spin,col){
  g.save();g.translate(x,y0);g.scale(sc,sc);g.strokeStyle=g.fillStyle=col;g.lineWidth=5;g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.moveTo(-22,0);g.lineTo(-8,-78);g.moveTo(22,0);g.lineTo(8,-78);g.moveTo(-17,-26);g.lineTo(13,-52);g.moveTo(17,-26);g.lineTo(-13,-52);g.moveTo(-10,-78);g.lineTo(10,-78);g.moveTo(8,-78);g.lineTo(56,0);g.stroke();
  g.lineWidth=4;g.beginPath();g.arc(0,-88,11,0,7);g.stroke();g.beginPath();g.arc(0,-88,2.5,0,7);g.fill();
  g.lineWidth=2;g.beginPath();for(let i=0;i<3;i++){const a=spin+i*Math.PI/3;g.moveTo(Math.cos(a)*10,-88+Math.sin(a)*10);g.lineTo(-Math.cos(a)*10,-88-Math.sin(a)*10)}g.stroke();
  g.fillRect(62,-24,36,24);g.beginPath();g.moveTo(57,-24);g.lineTo(80,-40);g.lineTo(103,-24);g.closePath();g.fill();
  g.fillStyle=C.sun;g.fillRect(74,-15,10,9);g.restore();
}
function sunRays(x,y,r,rot){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle='rgba(255,210,63,.2)';for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(0,0);g.lineTo(-r*.13,r);g.lineTo(r*.13,r);g.closePath();g.fill()}g.restore()}
function drawSky(){
  const y0=sY(0);if(y0<=0)return;
  g.fillStyle=C.sky;g.fillRect(0,0,W,y0+1);
  const sx=W*.8,sy=y0-H*.34,dr=RM?0:now*5*S,span=W+340*S,wrap=x=>((x+dr)%span+span)%span-170*S;
  if(!RM)sunRays(sx,sy,122*S,now*.1);
  g.fillStyle=C.sun;g.beginPath();g.arc(sx,sy,48*S,0,7);g.fill();
  g.fillStyle=C.haze;const c1=wrap(W*.22+170*S),c2=wrap(W*.66+170*S);pill(c1,y0-H*.27,150*S,22*S);pill(c1+34*S,y0-H*.27+18*S,96*S,18*S);pill(c2,y0-H*.16,170*S,20*S);
  if(!RM){const p=(now%13)/13;if(p<.6){const bx=lerp(-50*S,W+50*S,p/.6),by=y0-H*.3+Math.sin(now*1.3)*12*S,f=Math.sin(now*11)*5*S;g.strokeStyle=C.ink;g.lineWidth=2.6*S;g.lineCap='round';g.lineJoin='round';
    for(const[ox,oy]of[[0,0],[-22,9],[-40,-4]]){g.beginPath();g.moveTo(bx+(ox-8)*S,by+oy*S-f);g.lineTo(bx+ox*S,by+oy*S);g.lineTo(bx+(ox+8)*S,by+oy*S-f);g.stroke()}}}
  g.fillStyle=C.hill;g.beginPath();g.moveTo(0,y0+1);g.lineTo(0,y0-34*S);g.quadraticCurveTo(W*.2,y0-96*S,W*.44,y0-22*S);g.quadraticCurveTo(W*.72,y0-120*S,W,y0-40*S);g.lineTo(W,y0+1);g.closePath();g.fill();
  headframe(Math.max(46*S,W*.12),y0,S,RM?0:now*1.4,C.ink);
}
function drawGround(){
  const y0=Math.max(0,sY(0)),wA=world.cam+y0-feetY,wB=world.cam+H-feetY,BAND=230*S;
  g.fillStyle=sc(Math.max(0,wA)/STEP,'a');g.fillRect(0,y0,W,H-y0);
  for(let b=Math.max(1,Math.floor(wA/BAND));b<=Math.floor(wB/BAND)+1;b++){
    const top=sY(b*BAND);g.fillStyle=sc(b*BAND/STEP,b%2?'b':'a');g.beginPath();g.moveTo(0,H+2);g.lineTo(0,top);
    for(let x=0,i=0;x<=W+60;x+=60,i++)g.lineTo(x,top+(hash(b,i)-.5)*18*S);
    g.lineTo(W,H+2);g.closePath();g.fill();
  }
  const CS=112*S;
  for(let r=Math.max(0,Math.floor(wA/CS)-1);r<=Math.floor(wB/CS);r++)for(let c=0;c<=Math.ceil(W/CS);c++){
    const h=hash(c*7+3,r*13+1);if(h<.52)continue;
    const x=(c+.15+hash(c,r+99)*.7)*CS,wy=(r+.3+hash(c+41,r)*.6)*CS,y=sY(wy);if(wy<16*S)continue;
    const rot=hash(c+5,r+7)*6.28,sz=(.7+hash(c+9,r+2)*.7)*S,si=stratumOf(wy/STEP);
    const kind=si===1?(h<.68?'crack':'stone'):si===2?(h<.66?'blot':'dia'):si===3?(h<.62?'stone':'gold'):si===4?(h<.8?'lava':'stone'):h<.74?'blot':h<.9?'stone':'gold';
    g.save();g.translate(x,y);g.rotate(rot);g.scale(sz,sz);
    if(kind==='blot'){g.fillStyle='rgba(23,19,15,.26)';g.beginPath();g.ellipse(0,0,13,8,0,0,7);g.fill()}
    else if(kind==='crack'){g.strokeStyle='rgba(23,19,15,.5)';g.lineWidth=2.4;g.lineJoin='round';g.lineCap='round';g.beginPath();g.moveTo(-15,-4);g.lineTo(-5,3);g.lineTo(2,-5);g.lineTo(9,2);g.lineTo(16,-2);g.moveTo(2,-5);g.lineTo(5,-13);g.stroke()}
    else if(kind==='stone'){g.fillStyle=C.ink;g.beginPath();g.moveTo(-9,-3);g.lineTo(-2,-9);g.lineTo(8,-5);g.lineTo(10,4);g.lineTo(0,9);g.lineTo(-8,5);g.closePath();g.fill()}
    else if(kind==='gold'){g.fillStyle=C.sun;g.beginPath();g.moveTo(-6,0);g.lineTo(-1,-6);g.lineTo(6,-2);g.lineTo(4,5);g.lineTo(-3,6);g.closePath();g.fill()}
    else if(kind==='lava'){const pu=1+(RM?0:Math.sin(now*2+h*50)*.12);g.fillStyle=C.sky;g.beginPath();g.ellipse(0,0,15*pu,8*pu,0,0,7);g.fill();g.fillStyle=C.sun;g.beginPath();g.ellipse(-2,-1,8*pu,3.6*pu,0,0,7);g.fill()}
    else{g.fillStyle=C.dia;g.beginPath();g.moveTo(0,-9);g.lineTo(7,0);g.lineTo(0,9);g.lineTo(-7,0);g.closePath();g.fill();g.fillStyle=C.ice;g.beginPath();g.moveTo(0,-9);g.lineTo(7,0);g.lineTo(0,0);g.closePath();g.fill()}
    g.restore();
    if((kind==='dia'||kind==='gold'&&si===3)&&!RM){const tw=Math.sin(now*2.4+h*900)-.84;if(tw>0)star(x-2*sz,y-4*sz,tw*70*sz,0,kind==='dia'?C.white:C.pale)}
  }
}
function drawShaft(){
  const d=world.d*STEP,x0=cx-shaftW/2,x1=cx+shaftW/2,yt=sY(0),yb=sY(d);
  for(const G of world.galleries){const fy=sY(G.wy*STEP),top=Math.max(fy-(G.out?128:104)*S,yt);if(fy<=top)continue;
    const gx=G.out?x1-8*S:W-(W-x1+6)*G.grow,gw=G.out?(W-gx+2)*G.grow:W-gx+2; /* out: the passage of a getaway, dug from the shaft outward */
    g.fillStyle=sc(G.wy,'pit2');g.fillRect(gx,top,gw,fy-top);g.fillStyle=sc(G.wy,'pit');g.fillRect(gx,fy-7*S,gw,7*S)}
  if(d<1)return;
  const J=40*S;g.beginPath();g.moveTo(x0,yt);
  for(let k=1,y=J;y<d;k++,y+=J)g.lineTo(x0+(hash(1,k)-.5)*12*S,sY(y));
  g.lineTo(x0,yb);
  for(let i=1;i<6;i++)g.lineTo(x0+shaftW*i/6,yb+(hash(world.level+2,i)-.3)*5*S);
  g.lineTo(x1,yb);
  for(let k=Math.floor((d-1)/J),y=k*J;k>=1;k--,y-=J)g.lineTo(x1+(hash(2,k)-.5)*12*S,sY(y));
  g.lineTo(x1,yt);g.closePath();
  g.fillStyle=sc(world.d,'pit2');g.fill();
  g.save();g.clip();g.fillStyle=sc(world.d,'pit');g.beginPath();g.arc(cx,yb-70*S,Math.max(shaftW*.62,150*S),0,7);g.fill();g.restore();
  /* painted depth marks on the left wall */
  g.font='700 '+Math.round(12*S+1)+'px Grandstander, sans-serif';g.textAlign='right';g.textBaseline='middle';g.fillStyle=C.sun;
  const n0=Math.max(1,Math.floor((world.cam-feetY)/STEP)),n1=Math.min(Math.floor(world.d+.02),Math.floor((world.cam+H-feetY)/STEP)+1);
  for(let k=n0;k<=n1;k++){const y=sY(k*STEP);g.fillRect(x0-16*S,y-2*S,13*S,4*S);if(x0>70*S)g.fillText('−'+depthM(k)+' m',x0-22*S,y+1)}
}

/* ---------- miners ---------- */
const LEN=84;
function eyes(mood,blink,lx){
  const xs=[4+lx,11+lx],y=-85;g.fillStyle=g.strokeStyle=C.eye;g.lineWidth=2.2;g.lineCap='round';
  for(const x of xs){
    if(mood==='dead'){g.beginPath();g.moveTo(x-2.4,y-2.4);g.lineTo(x+2.4,y+2.4);g.moveTo(x+2.4,y-2.4);g.lineTo(x-2.4,y+2.4);g.stroke()}
    else if(mood==='happy'){g.beginPath();g.arc(x,y+1.5,2.7,Math.PI,0);g.stroke()}
    else if(blink){g.beginPath();g.moveTo(x-2.4,y);g.lineTo(x+2.4,y);g.stroke()}
    else{g.beginPath();g.arc(x,y,mood==='shock'?3.6:mood==='angry'?3:2.5,0,7);g.fill()}
  }
  if(mood==='angry'){g.fillStyle=C.ink;g.beginPath();g.moveTo(0,-91);g.lineTo(8,-91);g.lineTo(8,-85.5);g.lineTo(0,-88);g.closePath();g.fill();g.beginPath();g.moveTo(7,-91);g.lineTo(15.500,-91);g.lineTo(15.500,-88);g.lineTo(7,-85.5);g.closePath();g.fill()}
}
function shovel(P,shine){
  const a=P.a*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),gx=P.tx-dx*LEN,gy=P.ty-dy*LEN;
  g.strokeStyle=C.ink;g.lineWidth=5;g.beginPath();g.moveTo(gx,gy);g.lineTo(gx+dx*60,gy+dy*60);g.stroke();
  g.lineWidth=3.5;g.beginPath();g.arc(gx-dx*4,gy-dy*4,5,0,7);g.stroke();
  g.save();g.translate(gx+dx*58,gy+dy*58);g.rotate(a);
  const glow=clamp((shine-4)/6,0,1);
  if(glow>0){g.shadowColor=C.dia;g.shadowBlur=(8+glow*22+Math.sin(now*5)*4*glow)*S*DPR}
  g.fillStyle=bladeColor(shine);g.beginPath();g.moveTo(0,-10);g.lineTo(0,10);g.bezierCurveTo(14,11,22,5,26,0);g.bezierCurveTo(22,-5,14,-11,0,-10);g.closePath();g.fill();g.shadowBlur=0;
  const f=clamp((shine-2.5)/5,0,1);
  if(f>0){g.globalAlpha=f*.85;g.fillStyle=C.ice;g.beginPath();g.moveTo(2,-7.5);g.lineTo(21,-1);g.lineTo(2,-1);g.closePath();g.fill();
    if(shine>=8){g.fillStyle=C.white;g.beginPath();g.moveTo(3,2);g.lineTo(13,2);g.lineTo(3,6.5);g.closePath();g.fill()}g.globalAlpha=1}
  if(P.load>0){g.fillStyle=C.mound;g.beginPath();g.ellipse(13,-3,13*P.load,8*P.load,0,0,7);g.fill();g.fillStyle=C.clod;g.beginPath();g.ellipse(17,-5,5*P.load,3.5*P.load,0,0,7);g.fill()}
  g.restore();
  return{gx,gy,dx,dy};
}
function miner(x,y,o,P){
  g.save();g.translate(x,y);g.scale((o.flip?-1:1)*S*(o.wide||1)*(1+(o.squash||0)*.22),S*(1-(o.squash||0)*.26));
  g.fillStyle=g.strokeStyle=C.ink;g.lineCap='round';g.lineJoin='round';
  const st=o.walk?Math.sin(o.walk)*6:0,by=P.by||0;
  g.lineWidth=9;g.beginPath();g.moveTo(-7,-30+by);g.lineTo(-7-st,-5);g.moveTo(7,-30+by);g.lineTo(7+st,-5);g.stroke();
  g.beginPath();g.roundRect(-13-st,-8,17,8,3.5);g.roundRect(1+st,-8,17,8,3.5);g.fill();
  g.save();g.translate(0,by);
  g.beginPath();g.roundRect(-16,-72,32,46,11);g.fill();
  g.beginPath();g.arc(1,-85,14,0,7);g.fill();
  g.beginPath();g.arc(1,-90,15.5,Math.PI,0);g.lineTo(23,-90);g.lineTo(23,-86.5);g.lineTo(-14.5,-86.5);g.closePath();g.fill();
  if(o.stripe){g.fillStyle=C.sun;g.fillRect(-9,-101.5,5,6);g.fillStyle=C.ink}
  g.fillStyle=C.sun;g.beginPath();g.arc(13,-97,3.8,0,7);g.fill();
  eyes(o.mood,o.blink,o.look||0);

    rminer(lerp(G.ox,cx,q),lerp(G.oy,hy,q)-Math.sin(p*Math.PI)*70*S,{rot:G.rot*(1-q),mood:'shock',feet:[[-10,-6],[10,-4]],shine:hero.shine,look:0},STAND);return true}
  fo.mood='happy';fo.flip=!e.under;fo.feet=stride(s2,c2);fo.lean=.24;rminer(e.fx,hy,fo,fP);return false;
}
function rhud(){const s=Math.floor(R.score),b=Math.max(R.best,s);if(s!==R.shown){R.shown=s;rscoreEl.textContent=String(s)}if(b!==R.shownBest){R.shownBest=b;rbestEl.textContent='Record '+b}}

/* ---------- controls ---------- */
function rPress(){if(R.phase==='play'){R.held=true;R.buf=.13}}
function rKey(e,dn){
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===' '||k==='ArrowUp'||k==='w'||k==='z'){e.preventDefault();if(!dn)R.held=false;else if(!e.repeat)rPress()}
  else if(k==='ArrowDown'||k==='s'){e.preventDefault();R.kd=dn}
  else if(k==='Escape'){e.preventDefault();if(dn)quitRun()}
  else if(k==='Enter')e.preventDefault();
}

/* ---------- particles of the chase (world units, y up) ---------- */
function rdust(x,y,n){for(let i=0;i<n;i++)R.fx.push({k:'dust',x:x+rnd(-8,8),y:y+rnd(0,6),vx:rnd(-70,20),vy:rnd(10,80),g:0,life:0,max:rnd(.3,.6),r:rnd(4,9),c:C.mound})}
function rchunks(x,y,n,cols){for(let i=0;i<n;i++)R.fx.push({k:'chunk',x:x+rnd(-12,12),y:y+rnd(-8,12),vx:rnd(-80,380),vy:rnd(140,560),g:1700,life:0,max:rnd(.5,.95),r:rnd(3,8),rot:rnd(0,6),vr:rnd(-9,9),c:pick(cols)})}
function rspark(x,y,n,cols){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(60,300);R.fx.push({k:'spark',x,y,vx:Math.cos(a)*v+R.v*.6,vy:Math.sin(a)*v+60,g:500,life:0,max:rnd(.3,.7),r:rnd(4,9),rot:rnd(0,3),vr:rnd(-5,5),c:pick(cols)})}}
function sweat(n){for(let i=0;i<n;i++)R.fx.push({k:'drop',x:R.x+rnd(-6,12),y:R.y+rnd(90,106),vx:R.v+rnd(-230,-70),vy:rnd(90,240),g:900,life:0,max:.5,r:3,c:C.ice})}
function fxStep(dt){for(let i=R.fx.length-1;i>=0;i--){const p=R.fx[i];p.life+=dt;if(p.life>=p.max){R.fx.splice(i,1);continue}p.vy-=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;if(p.k==='chunk'&&p.y<0&&p.vy<0){p.y=0;p.vy*=-.4;p.vx*=.6}}}

/* ---------- the track: obstacles, nuggets, the cart ---------- */
function ob(k,x,y0){const s=OB[k],o={k,x,w:s[0],h:s[1],y0:y0||0,hit:false,ph:rnd(0,6)};R.obs.push(o);return o}
function nugRow(x0,x1,n,y){for(let i=0;i<n;i++)R.nugs.push({x:lerp(x0,x1,n>1?i/(n-1):.5),y,got:false})}
function nugArc(x,h,v){const w=clamp(v*.19,60,130);for(let i=-2;i<=2;i++)R.nugs.push({x:x+i*w/2,y:h+40+(1-i*i/4)*44,got:false})}
function spawn(){
  const ahead=(W-R.hx)/R.RS+260;
  while(R.nextX<R.x+ahead){
    const x=R.nextX,pt=R.pt,d=clamp(pt/70,0,1),b=biome(Math.floor(x/CW)),v=Math.max(R.v,300),r=Math.random();let w=40;
    if(pt>R.cartAt&&R.cart<=0&&!R.pick){R.pick={x};R.cartAt=pt+rnd(26,38);R.nextX=x+v*.9+170;continue}
    if(pt>10&&r<.14+d*.08){const low=pt>22&&Math.random()<.3;ob('bat',x,low?14:64);if(!low&&Math.random()<.6)nugRow(x-70,x+70,5,16)}
    else if(b>0&&pt>14&&r<.26+d*.14){ob('beam',x,58);w=56;if(Math.random()<.6)nugRow(x-80,x+80,5,16)}
    else if(r<.58){const o=ob(pick(['rock','rock','barrel','crate','rock2']),x);w=o.w;if(Math.random()<.6)nugArc(x,o.h,v)}
    else if(r<.8){ob('rock',x);ob('rock',x+44);w=84;if(Math.random()<.5)nugArc(x+22,30,v)}
    else{nugRow(x,x+200,6,24);w=200}
    R.nextX=x+w+v*rnd(.72,1.2)*(1.3-d*.35)+110;
  }
  while(R.obs.length&&R.obs[0].x<R.x-1500)R.obs.shift();
  while(R.nugs.length&&R.nugs[0].x<R.x-1500)R.nugs.shift();
  if(R.pick&&R.pick.x<R.x-400)R.pick=null;
}
function smash(o,soft){
  o.hit=true;rchunks(o.x,o.y0+Math.min(o.h,60)/2,soft?8:14,o.k==='bat'?[C.ink,C.ink,C.sun]:o.k==='heap'?[C.mound,C.clod]:o.k==='beam'?[C.ink,C.sun,C.clod]:[C.ink,C.clod,C.pit2]);
  if(!soft){R.bonus+=5;sfx.smash();R.shake=5}
}
function collide(slide){
  const cart=R.cart>0,x0=R.x-(slide?38:cart?34:12),x1=R.x+(slide?34:cart?36:12),y0=R.y+(cart?0:4),y1=R.y+(slide?46:96);
  for(const n of R.nugs){if(n.got||n.x<x0-16||n.x>x1+16||n.y<y0-14||n.y>y1+12)continue;
    n.got=true;R.bonus+=5;R.combo=R.t<R.comboT?R.combo+1:1;R.comboT=R.t+.8;sfx.nug(R.combo);rspark(n.x,n.y,4,[C.sun,C.pale,C.white])}
  for(const o of R.obs){
    if(o.hit||o.x+o.w/2-5<=x0||o.x-o.w/2+5>=x1||o.y0+o.h-4<=y0||o.y0+(o.y0?3:0)>=y1)continue;
    if(cart){smash(o);continue}
    if(R.inv>0)continue;
    smash(o,true);stumble();if(R.phase!=='play')return;
  }
  const p=R.pick;if(p&&Math.abs(p.x-R.x)<46&&R.y<64){R.pick=null;cartStart()}
}
function stumble(){
  sfx.oof();R.shake=9;R.freeze=.07;R.combo=0;
  if(R.heat>0){caught();return}
  R.heat=7;R.gapTo=68;R.stum=.5;R.inv=1.2;R.v*=.55;R.mood='shock';R.moodT=0;R.fmood='happy';R.fmoodT=R.t+1.3;sweat(4);
}
function cartStart(){R.cart=5.2;R.heat=0;R.gapTo=340;R.stum=0;R.inv=0;R.duck=0;R.mood='happy';R.moodT=0;R.fmood='shock';R.fmoodT=0;R.flash=.6;R.shake=6;sfx.cart();rspark(R.x,50,16,[C.sun,C.pale,C.white])}
function cartEnd(){R.cart=0;R.gapTo=R.far;R.inv=1.3;R.mood='calm';R.fmood='angry';rchunks(R.x,24,14,[C.ink,C.clod,C.sun]);sfx.smash();if(!R.air){R.vy=JUMP*.7;R.air=true}}
function caught(){
  if(R.phase!=='play')return;
  R.phase='caught';R.ct=0;R.cart=0;R.pick=null;R.clod=null;R.duck=0;R.mood='shock';R.moodT=0;R.fmood='angry';R.fmoodT=0;R.fact='run';R.fload=0;
  const s=Math.floor(R.score);if(s>R.best){R.best=s;try{localStorage.setItem('digger-run-best',String(s))}catch(e){}if(R.best0>0||s>0){rsign.classList.add('rec');bump(rsign)}}
}

/* ---------- the rival: closes in after a stumble, hops what the hero cleared, lobs sand ahead ---------- */
function aimSand(){
  let tx=R.x+R.v*.75+Math.max(200,R.v*.45);
  for(let n=0;n<2;n++){if(!R.obs.some(o=>!o.hit&&Math.abs(o.x-tx)<150)&&!(R.pick&&Math.abs(R.pick.x-tx)<180))return tx;tx+=170}
  return 0;
}
function foeStep(dt){
  const pt=R.pt,fxw=R.x-R.gap,cart=R.cart>0;
  R.gap+=(R.gapTo-R.gap)*(1-Math.exp(-dt*(R.gapTo<R.gap?3.2:1.5)));
  if(R.fmoodT&&R.t>R.fmoodT){R.fmood='angry';R.fmoodT=0}
  if(R.fy<=0&&!R.fvy)for(const o of R.obs){if(o.hit)continue;const d=o.x-fxw;
    if(o.y0<30){if(d>16&&d<16+R.v*.2){R.fvy=JUMP*.95;break}}else if(d>-50&&d<40+R.v*.1)R.fduck=.2}
  if(R.fvy||R.fy>0){R.fvy-=GRAV*dt;R.fy+=R.fvy*dt;if(R.fy<=0){R.fy=0;R.fvy=0;rdust(fxw,0,3)}}
  R.fduck-=dt;
  if(R.fact==='run'){
    if(pt>=R.throwAt&&!R.clod&&!cart&&R.fy<=0&&R.gap<210){R.fact='scoop';R.ft=0;sfx.scoop()}
    else if(R.heat>0&&R.gap<92&&R.t>R.swingAt){R.fact='swing';R.ft=0;R.swingAt=R.t+rnd(1,1.5);sfx.fling();sweat(2)}
  }else if(R.fact==='scoop'){R.ft+=dt/.2;if(R.ft>=1){R.fact='lift';R.ft=0;R.fload=1;rdust(fxw+44,0,3)}}
  else if(R.fact==='lift'){R.ft+=dt/.16;if(R.ft>=1){
    R.fact='run';R.fload=0;const tx=aimSand();
    if(tx){R.clod={x0:fxw+40,y0:118,tx,p:0};R.nextX=Math.max(R.nextX,tx+R.v*.7+150);sfx.fling();sfx.whistle();R.throwAt=pt+rnd(4.5,8)}else{rdust(fxw+40,60,4);R.throwAt=pt+1.2}}}
  else if(R.fact==='swing'){R.ft+=dt/.32;if(R.ft>=1)R.fact='run'}
  const c=R.clod;if(c){c.p+=dt/.75;if(c.p>=1){
    R.clod=null;const o=ob('heap',c.tx);R.obs.sort((a,b)=>a.x-b.x);rdust(c.tx,0,9);noise(.3,{f:600,to:160,v:.25});
    if(Math.abs(R.x-c.tx)<34&&R.y<40&&R.inv<=0&&!cart){smash(o,true);stumble()}}}
}

/* ---------- one step of the game ---------- */
function airStep(dt,fast,held){
  if(fast)R.vy=Math.min(R.vy,-1050);
  R.vy-=GRAV*dt*(R.vy>0&&!held?2.6:1);R.y+=R.vy*dt;
  if(R.y<=0){R.y=0;R.vy=0;R.air=false;R.sq=.45;rdust(R.x,0,5);sfx.land();return true}
  return false;
}
function runUpdate(dt){
  R.t+=dt;R.shake*=Math.exp(-dt*9);R.sq*=Math.exp(-dt*11);R.flash=Math.max(0,R.flash-dt*2.5);
  if(R.moodT&&R.t>R.moodT){R.mood=R.heat>0?'shock':'calm';R.moodT=0}
  if(R.waiting&&!R.ready&&(R.later||Q.batches.some((b,k)=>k>=Q.b&&b.items.length>(k===Q.b?Q.i:0)))){R.ready=true;rquit.classList.add('ready');sfx.pop()}
  if(R.freeze>0){R.freeze-=dt;return}
  const ph=R.phase;
  if(R.ent<1){R.ent=Math.min(1,R.ent+dt/.55);R.hx=lerp(-70*R.RS,R.hx0,ease.out(R.ent))} /* he runs into the frame from the left, the rival on his heels */
  if(ph==='play'){
    const pt=(R.pt+=dt),cart=R.cart>0,down=R.kd||R.td;
    R.v+=(Math.min(R.vmax,300+pt*6.5)*(cart?1.4:1)-R.v)*(1-Math.exp(-dt*2.2));
    R.x+=R.v*dt;R.dist+=R.v*dt;R.score=R.dist/10+R.bonus;
    R.buf-=dt;R.inv-=dt;R.stum-=dt;
    if(R.heat>0){R.heat-=dt;if(R.heat<=0){R.gapTo=R.far;if(!R.moodT&&!cart)R.mood='calm'}else if(Math.random()<dt*2.5)sweat(1)}
    if(cart){R.cart-=dt;if(R.t>R.rollT){R.rollT=R.t+.11;if(!R.air){sfx.roll();rspark(R.x-18,4,1,[C.sun,C.white])}}if(R.cart<=0)cartEnd()}
    if(!R.air)R.coy=.09;else R.coy-=dt;
    if(R.buf>0&&R.coy>0){R.buf=0;R.coy=0;R.vy=JUMP;R.air=true;R.duck=0;R.sq=-.35;sfx.jump();rdust(R.x-6,0,4)}
    if(R.air)airStep(dt,down&&!cart,R.held);
    const was=R.duck>0&&!R.air;
    if(!R.air&&!cart&&down)R.duck=.3;else R.duck-=dt;
    if(R.duck<=0&&was&&R.obs.some(o=>!o.hit&&o.y0>46&&o.x+o.w/2>R.x-44&&o.x-o.w/2<R.x+40))R.duck=.05; /* never stand up into a beam */
    const slide=R.duck>0&&!R.air&&!cart;
    if(slide&&!was)sfx.slide();
    if(slide&&Math.random()<dt*40)rdust(R.x-30,0,1);
    if(!R.air&&!slide){R.step+=dt*(7+R.v/52);const n=Math.floor(R.step/Math.PI);if(n!==R.stepN){R.stepN=n;if(!cart){sfx.step();rdust(R.x-8,0,1)}}}
    else R.step+=dt*6;
    spawn();collide(slide);
    if(R.phase==='play'){
      foeStep(dt);
      const m=Math.floor(R.score/250);if(m>R.mile){R.mile=m;sfx.mile();bump(rsign);R.flash=.45}
      if(!R.rec&&R.best0>0&&R.score>R.best0){R.rec=true;rsign.classList.add('rec');bump(rsign);sfx.win();rspark(R.x,R.y+112,18,[C.dia,C.ice,C.white])}
    }
  }else if(ph==='caught'){ /* he trips, the rival catches up and hooks his shovel */
    R.ct+=dt;R.v*=Math.exp(-dt*6);R.x+=R.v*dt;if(R.air)airStep(dt,false,false);
    R.gap+=(52-R.gap)*(1-Math.exp(-dt*8));if(R.fy>0||R.fvy){R.fvy-=GRAV*dt;R.fy=Math.max(0,R.fy+R.fvy*dt);if(!R.fy)R.fvy=0}
    R.step+=dt*(2+R.v/40);
    if(R.ct>.55&&!R.air){R.phase='drag';R.ct=0;R.v=0;R.fy=0;R.shake=7;R.flash=.35;sfx.grab();sfx.drag();rspark(R.x-20,60,10,[C.sun,C.pale,C.white]);rdust(R.x,0,10)}
  }else if(ph==='drag'){ /* ...and hauls him all the way back at full speed */
    R.ct+=dt;const p=clamp(R.ct/1.05,0,1);R.v=-(240+2500*p*p);R.x+=R.v*dt;R.step+=dt*26;R.gap+=(96-R.gap)*(1-Math.exp(-dt*10));
    if(Math.random()<dt*60)rdust(R.x+rnd(0,110),0,1);
    if(R.ct>.6)R.hx=lerp(R.hx0,-330*R.RS,ease.in(clamp((R.ct-.6)/.4,0,1)));
    if(R.ct>=1)finishRun();
  }
  fxStep(dt);rhud();
}

/* ---------- drawing: figures ---------- */
function rminer(x,y,o,P){ /* same miner as the quiz, with free feet, a hip drop, a leaning torso and an optional full turn */
  const k=RK,sq=o.sq||0;g.save();g.translate(x,y);if(o.rot)g.rotate(o.rot);g.scale((o.flip?-1:1)*k*(o.wide||1)*(1+sq*.2),k*(1-sq*.24));
  g.fillStyle=g.strokeStyle=C.ink;g.lineCap='round';g.lineJoin='round';
  const F=o.feet,hp=o.hip||0;
  g.lineWidth=9;g.beginPath();g.moveTo(-6,-30+hp);g.lineTo(F[0][0],F[0][1]);g.moveTo(6,-30+hp);g.lineTo(F[1][0],F[1][1]);g.stroke();
  g.beginPath();g.roundRect(F[0][0]-6,F[0][1]-3,17,8,3.5);g.roundRect(F[1][0]-6,F[1][1]-3,17,8,3.5);g.fill();
  g.translate(0,-30+hp);g.rotate(o.lean||0);g.translate(0,30);
  g.beginPath();g.roundRect(-16,-72,32,46,11);g.fill();
  g.beginPath();g.arc(1,-85,14,0,7);g.fill();
  g.beginPath();g.arc(1,-90,15.5,Math.PI,0);g.lineTo(23,-90);g.lineTo(23,-86.5);g.lineTo(-14.5,-86.5);g.closePath();g.fill();
  if(o.stripe){g.fillStyle=C.sun;g.fillRect(-9,-101.5,5,6);g.fillStyle=C.ink}
  g.fillStyle=C.sun;g.beginPath();g.arc(13,-97,3.8,0,7);g.fill();
  eyes(o.mood,o.blink,o.look||0);
  g.fillStyle=g.strokeStyle=C.ink;let a1=o.arms&&o.arms[0],a2=o.hand2||(o.arms&&o.arms[1]);
  if(P){const s=shovel(P,o.shine||0);a1=[s.gx+s.dx*LEN*P.a1,s.gy+s.dy*LEN*P.a1];if(!a2)a2=[s.gx+s.dx*LEN*P.a2,s.gy+s.dy*LEN*P.a2]}
  g.strokeStyle=C.ink;g.lineWidth=8;g.beginPath();if(a1){g.moveTo(12,-63);g.lineTo(a1[0],a1[1])}if(a2){g.moveTo(-12,-63);g.lineTo(a2[0],a2[1])}g.stroke();
  g.restore();
}
function drawCart(spin){ /* origin on the rail, unit scale set by the caller */
  g.fillStyle=C.ink;g.beginPath();g.moveTo(-37,-46);g.lineTo(37,-46);g.lineTo(29,-13);g.lineTo(-29,-13);g.closePath();g.fill();
  g.fillStyle=C.sun;g.beginPath();g.roundRect(-40,-50,80,6,3);g.fill();
  for(const wx of[-18,18]){g.fillStyle=C.ink;g.beginPath();g.arc(wx,-9,9.5,0,7);g.fill();g.strokeStyle=C.sun;g.lineWidth=2.2;g.beginPath();g.moveTo(wx+Math.cos(spin)*6,-9+Math.sin(spin)*6);g.lineTo(wx-Math.cos(spin)*6,-9-Math.sin(spin)*6);g.stroke()}
}
const stride=(s,c)=>[[s*15,-5-Math.max(0,c)*11],[-s*15,-5-Math.max(0,-c)*11]];
function drawRunHero(){
  const k=R.RS,x=R.hx,y=rY(R.y),s=Math.sin(R.step),c=Math.cos(R.step),ph=R.phase;
  if(R.inv>0&&ph==='play'&&Math.floor(R.t*14)%2)return;
  const o={mood:R.mood,blink:R.t%3.3<.12,shine:hero.shine,sq:R.sq,look:1.2};
  let P=CARRY(s,c);
  if(R.cart>0){o.feet=[[-6,-8],[6,-8]];o.lean=.1;o.sq=0;rminer(x,y-22*k,o,{tx:66,ty:-66+s*2,a:-8,a1:.25,a2:.5});g.save();g.translate(x,y+Math.abs(s)*-1.5*k);g.scale(k,k);drawCart(R.step*2);g.restore();return}
  if(ph==='caught'){const p=ease.out(clamp(R.ct/.3,0,1));o.feet=[[-18,-4],[-6,-4]];o.lean=lerp(.3,1.4,p);o.hip=lerp(0,20,p);o.arms=[[34,-78],[28,-60]];P=null;
    g.save();g.translate(x+(26+p*30)*k,R.GY-5*k);g.scale(k,k);g.lineCap='round';shovel({tx:84,ty:-6,a:-4},hero.shine);g.restore()}
  else if(R.air){const tk=clamp(1-Math.abs(R.vy)/JUMP,0,1);o.feet=[[-14,-8-tk*14],[12,-4-tk*18]];o.lean=.12-R.vy/5200}
  else if(R.duck>0){o.feet=[[24,-5],[36,-10]];o.hip=17;o.lean=-1.12;P={tx:45,ty:17,a:64,a1:.15,a2:.4}}
  else if(R.stum>0){o.feet=[[s*9-10,-5],[4-s*9,-5-Math.max(0,c)*7]];o.lean=.62;P={tx:40+s*8,ty:-84+c*8,a:-40+s*30,a1:.2,a2:.42}}
  else{o.feet=stride(s,c);o.lean=.2;o.hip=-Math.abs(c)*2.5}
  rminer(x,y,o,P);
}
function drawRunFoe(){
  const k=R.RS,x=rX(R.x-R.gap),y=rY(R.fy);if(x<-90*k)return;
  const s=Math.sin(R.step+1.3),c=Math.cos(R.step+1.3),run=[40+s*3,-100+c*4,-58+s*6],f=R.fact,t=clamp(R.ft,0,1),L=(A,B,u)=>[lerp(A[0],B[0],u),lerp(A[1],B[1],u),lerp(A[2],B[2],u)];
  const p=f==='scoop'?L(run,FP.scoop,ease.io(t)):f==='lift'?L(FP.scoop,FP.raise,ease.in(t)):f==='swing'?L(run,FP.swing,Math.sin(t*Math.PI)):run;
  const o={mood:R.fmood,stripe:1,wide:1.12,look:1,blink:(R.t+1)%2.9<.1};
  if(R.phase==='caught'&&R.v<60)o.feet=[[-8,-5],[8,-5]];
  else if(R.fy>0){o.feet=[[-14,-14],[12,-10]];o.lean=.15}
  else if(R.fduck>0){o.feet=[[s*12,-5],[-s*12,-5]];o.lean=.8;o.hip=14}
  else{o.feet=stride(s,c);o.lean=.24}
  rminer(x,y,o,{tx:p[0],ty:p[1],a:p[2],a1:.16,a2:.52,load:R.fload});

  const pk=R.pick;if(pk){const x=rX(pk.x);if(x>-80&&x<W+80){g.save();g.translate(x,GY);g.scale(k,k);drawCart(0);const by=-78+Math.sin(t*6)*5;g.fillStyle=C.sun;g.strokeStyle=C.ink;g.lineWidth=3;g.lineJoin='round';g.beginPath();g.moveTo(-11,by-12);g.lineTo(11,by-12);g.lineTo(0,by+4);g.closePath();g.fill();g.stroke();g.restore();star(x-30*k,GY-(58+Math.sin(t*4)*6)*k,tw(3)*9*k+3*k,t,C.white)}}
  for(const n of R.nugs){if(n.got)continue;const x=rX(n.x);if(x<-20||x>W+20)continue;
    g.save();g.translate(x,rY(n.y+Math.sin(t*5+n.x*.05)*3));g.scale(k,k);g.fillStyle=C.sun;g.strokeStyle=C.ink;g.lineWidth=2.4;g.lineJoin='round';g.beginPath();g.moveTo(-8,1);g.lineTo(-3,-8);g.lineTo(7,-5);g.lineTo(8,4);g.lineTo(-1,8);g.closePath();g.stroke();g.fill();g.fillStyle=C.pale;g.beginPath();g.moveTo(-3,-8);g.lineTo(7,-5);g.lineTo(1,-1);g.closePath();g.fill();g.restore()}
  for(const o of R.obs)if(!o.hit)drawOb(o);
  if(R.phase==='drag')drawDrag(rX(R.x-R.gap),GY,t,R.step);else{drawRunFoe();drawRunHero()}
  if(cl){const p=cl.p,x=rX(lerp(cl.x0,cl.tx,p)),y=rY(lerp(cl.y0,10,p)+110*4*p*(1-p));g.fillStyle=C.mound;g.beginPath();g.arc(x,y,12*k,0,7);g.fill();g.fillStyle=C.clod;g.beginPath();g.arc(x+Math.cos(t*14)*5*k,y+Math.sin(t*14)*5*k,5*k,0,7);g.fill()}
  for(const p of R.fx){const u=p.life/p.max,x=rX(p.x),y=rY(p.y),r=p.r*k;
    if(p.k==='dust'){g.globalAlpha=(1-u)*.5;g.fillStyle=p.c;g.beginPath();g.arc(x,y,r*(1+u),0,7);g.fill();g.globalAlpha=1}
    else if(p.k==='spark')star(x,y,r*(1-u*u),p.rot,p.c);
    else if(p.k==='drop'){g.fillStyle=p.c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
    else{g.save();g.translate(x,y);g.rotate(p.rot);g.fillStyle=p.c;g.beginPath();g.moveTo(-r,-r*.3);g.lineTo(-r*.2,-r);g.lineTo(r,-r*.4);g.lineTo(r*.6,r*.8);g.lineTo(-r*.7,r*.7);g.closePath();g.fill();g.restore()}}
  /* speed lines when it really moves */
  const fast=R.phase==='drag'?1:R.cart>0?.8:clamp((R.v-520)/160,0,1);
  if(fast>0&&!RM){g.fillStyle='rgba(255,224,138,'+(.3*fast)+')';for(let i=0;i<7;i++){const y=cy+(GY-cy)*hash(i,Math.floor(t*3)+i),x=((i*197+t*(R.v<0?1500:-1500))%(W+260)+W+260)%(W+260)-130;g.fillRect(x,y,(70+i*14)*k,2.5*k)}}
  if(R.flash>0){g.fillStyle='rgba(255,241,207,'+(R.flash*.35)+')';g.fillRect(0,0,W,H)}
}

/* ================= boot ================= */
$('#rquit').addEventListener('click',()=>{ac();quitRun()});
resize();addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(game);
try{st.best=+localStorage.getItem('digger-best')||0;R.best=+localStorage.getItem('digger-run-best')||0}catch(e){}
refreshHud();fillVeins();
fetch('data/questions.json').then(r=>r.ok?r.json():Promise.reject()).then(a=>{const ok=(Array.isArray(a)?a:[]).filter(validQ);if(ok.length>=12){BANK=ok;if(st.mode==='intro')fillVeins()}}).catch(()=>{});
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  if(!R.on&&esc.on)escStep(dt);            /* the getaway / the return: quiz clock frozen, scene still alive */
  if(R.on){runUpdate(dt);if(R.on)runDraw();else draw()}
  else if(esc.on){ambient(dt);draw()}
  else{now+=dt;update(dt);draw()}
  requestAnimationFrame(frame);
}
if(/[#&]debug\b/.test(location.hash))window.__digger={R,Q,st,world,hero,esc,enterRun,bank}; /* test hook, inert otherwise */
requestAnimationFrame(frame);
if(matchMedia('(pointer:fine)').matches)input.focus({preventScroll:true});
})();
</script>
