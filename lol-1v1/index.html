<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roulette 1v1 LoL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ddragon.leagueoflegends.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-halo bg-halo--blue"></div>
    <div class="bg-halo bg-halo--red"></div>
    <div class="bg-noise"></div>
  </div>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">1V1</span>
        <span class="brand-text">ROULETTE<small id="patch">Data Dragon —</small></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-history" type="button" aria-controls="history" aria-expanded="false" aria-label="Historique" title="Historique">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 7v5l3 2"/></svg>
          <b class="badge" id="history-count">0</b>
        </button>
        <button class="icon-btn" id="btn-mute" type="button" aria-pressed="false" aria-label="Son" title="Son">
          <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
        <button class="icon-btn icon-btn--humor" id="btn-humor" type="button" aria-pressed="false" aria-label="Mode Humour / BD" title="Mode Humour / BD">
          <span class="humor-label">BD</span>
        </button>
      </div>
    </header>

    <main class="stage">
      <section class="rail rail--blue" aria-label="Blue Side">
        <div class="rail-label"><span class="dot"></span>BLUE SIDE</div>
        <div class="rail-window" id="reel-blue">
          <div class="rail-track"></div>
          <div class="laser" aria-hidden="true"></div>
        </div>
      </section>

      <div class="center">
        <div class="versus-row">
          <div class="player player--blue">
            <input class="player-name" id="name-blue" type="text" maxlength="16" placeholder="Joueur Blue" spellcheck="false" autocomplete="off" aria-label="Nom du joueur Blue Side">
            <span class="player-score" id="score-blue" aria-label="Score Blue">0</span>
          </div>
          <div class="go-wrap" id="go-wrap">
            <button class="go" id="go" type="button" disabled>
              <span class="go-label" id="go-label">CHARGEMENT…</span>
            </button>
          </div>
          <div class="player player--red">
            <span class="player-score" id="score-red" aria-label="Score Red">0</span>
            <input class="player-name" id="name-red" type="text" maxlength="16" placeholder="Joueur Red" spellcheck="false" autocomplete="off" aria-label="Nom du joueur Red Side">
          </div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Chargement du roster…</div>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="class-picker" id="class-picker">
          <button class="class-btn" id="class-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="class-label">Toutes les classes</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <ul class="class-menu" id="class-menu" role="listbox" hidden></ul>
        </div>
      </div>

      <section class="rail rail--red" aria-label="Red Side">
        <div class="rail-label"><span class="dot"></span>RED SIDE</div>
        <div class="rail-window" id="reel-red">
          <div class="rail-track"></div>
          <div class="laser" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="faceoff" id="faceoff" hidden>
    <div class="faceoff-backdrop"></div>
    <div class="faceoff-flash"></div>
    <div class="fx-veil" id="fx-veil" aria-hidden="true"></div>
    <div class="fx-lid" id="fx-lid" aria-hidden="true"></div>
    <div class="faceoff-inner">
      <div class="fighter fighter--blue" id="fighter-blue"></div>
      <div class="vs" aria-hidden="true"><span>VS</span></div>
      <div class="fighter fighter--red" id="fighter-red"></div>
      <div class="predict" id="predict" hidden>
        <div class="predict-head">
          <span class="predict-side predict-side--blue"><b id="predict-blue">50%</b> <span id="predict-blue-name"></span></span>
          <span class="predict-label" title="Estimation calculée sur les stats de base officielles (Data Dragon) au niveau 6 : PV, armure, résistance magique, dégâts, vitesse d'attaque, portée, notes attaque/défense/magie et classe. Ce n'est pas un winrate réel.">Pronostic · stats de base ⓘ</span>
          <span class="predict-side predict-side--red"><span id="predict-red-name"></span> <b id="predict-red">50%</b></span>
        </div>
        <div class="predict-bar" id="predict-bar"><span></span></div>
      </div>
      <div class="rule" id="rule">
        <div class="rule-art" id="rule-art" aria-hidden="true"></div>
        <div class="rule-col">
          <span class="rule-label">Objectif</span>
          <span class="rule-objective" id="rule-objective">—</span>
        </div>
        <span class="rule-sep" aria-hidden="true"></span>
        <div class="rule-col rule-col--main">
          <span class="rule-label">Défi</span>
          <span class="rule-text" id="rule-text">—</span>
        </div>
        <button class="rule-reroll" id="btn-rule" type="button" title="Tirer un autre défi" aria-label="Tirer un autre défi">🎲</button>
      </div>
      <div class="faceoff-actions">
        <button class="btn btn--primary" id="btn-reroll" type="button">RELANCER UN 1V1</button>
        <button class="btn btn--ghost" id="btn-copy" type="button">COPIER LE DUEL</button>
      </div>
      <button class="faceoff-close" id="btn-close" type="button" aria-label="Fermer">✕</button>
    </div>
  </div>

  <aside class="history" id="history" hidden aria-label="Historique des duels">
    <div class="history-head">
      <h2>HISTORIQUE</h2>
      <button class="chip" id="btn-reset" type="button">Remettre à zéro</button>
      <button class="history-close" id="history-close" type="button" aria-label="Fermer">✕</button>
    </div>
    <ol class="history-list" id="history-list"></ol>
    <p class="history-empty" id="history-empty">Aucun duel pour l'instant. Lance la roulette !</p>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas class="fx-canvas" id="fx-canvas" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
